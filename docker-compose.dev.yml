# ============================================
# Jewellery CRM — Development Docker Compose
# ============================================
# Usage: docker compose -f docker-compose.dev.yml up -d

version: "3.9"

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: jewellery_crm_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jewellery_admin
      POSTGRES_PASSWORD: jewellery_secure_2026
      POSTGRES_DB: jewellery_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewellery_admin -d jewellery_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 for caching and real-time pub/sub
  redis:
    image: redis:7-alpine
    container_name: jewellery_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
