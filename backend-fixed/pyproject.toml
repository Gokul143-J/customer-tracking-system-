[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jewellery-crm-backend"
version = "1.0.0"
description = "Jewellery CRM & Customer Journey Tracker - Backend API"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.14.0",

    # Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",

    # Redis
    "redis[hiredis]>=5.2.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",

    # QR Code & Barcode
    "qrcode[pil]>=8.0",
    "python-barcode>=0.15.1",
    "Pillow>=10.0.0",

    # Reports
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",

    # Email
    "fastapi-mail>=1.4.2",

    # WebSockets
    "websockets>=14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
